[project]
name = "limites"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "boto3",
  "simplejson>=4.2.0",
  "plataforma",
]

[dependency-groups]
# Só nos testes: o TestClient do Starlette usa httpx. O serviço não faz chamada HTTP de saída, então httpx não vai
# para a imagem (o Dockerfile instala com --no-dev).
dev = ["httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limites"]

[tool.uv.sources]
plataforma = { workspace = true }
