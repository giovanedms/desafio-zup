[project]
name = "autorizacao"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "boto3",
  "httpx",
  "simplejson>=4.2.0",
  "plataforma",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autorizacao"]

[tool.uv.sources]
plataforma = { workspace = true }
