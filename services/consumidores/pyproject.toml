[project]
name = "consumidores"
version = "0.1.0"
description = "Consumidores de referência das filas antifraude e notificacoes (Lambda SQS)."
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3",
  "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumidores"]
