openapi: 3.0.3
# Contrato PÚBLICO (contract-first). Versão 3.0.3 de propósito: o API Gateway REST importa 2.0/3.0, não 3.1 (ADR-0011).
# Extensões x-amazon-apigateway-* NÃO ficam aqui — o Terraform as acrescenta no deploy, para o contrato não depender de fornecedor.
info:
  title: API de Autorização de Transações
  version: 1.0.0
  description: |
    Autorização síncrona de transações financeiras com verificação e reserva de limite por contrato.

    **Idempotência:** toda operação mutante exige `Idempotency-Key`. O escopo é `(client_id do token, método, URI concreta, chave)`.
    Repetir a mesma chave com o mesmo corpo devolve o resultado original: aprovação 201 → 200 com corpo idêntico; recusa → o mesmo
    status (402/404/409/422) com corpo idêntico. O corpo do replay guarda o `correlation_id` (e o `trace_id`) da execução original;
    o header `X-Correlation-Id` é sempre o desta requisição.
    Mesma chave com corpo diferente → 422. Mesma chave ainda em processamento → 409. A chave vale enquanto a autorização
    estiver na retenção quente (30 dias), que é maior que a vida de uma reserva (7 dias).

    **Erros:** `application/problem+json` conforme RFC 9457 (sucessora da RFC 7807 citada no enunciado), inclusive os gerados
    pelo gateway (400 de parâmetro ausente, 401, 403, 429, 5xx) e os de roteamento do serviço (405 método não suportado, 404 rota
    inexistente). Extensões: `codigo`, `correlation_id`, `trace_id` e, conforme o caso, `erros`, `erros_omitidos`,
    `id_autorizacao` e `limite_disponivel`. Desvio: o 429 das regras rate-based do WAF sai com
    `Content-Type: application/json` e corpo fixo, sem `correlation_id` (ver o catálogo).

    **Validação do corpo:** a autoridade é o serviço. O gateway não valida o corpo (só a presença dos parâmetros obrigatórios),
    então o mesmo corpo recebe o mesmo status local e na AWS: fora deste schema ou da regra de domínio → 422.

    **Versionamento:** major no path (`/v1`). Dentro de um major só entram mudanças aditivas. Depreciação anunciada com os headers
    `Deprecation` (RFC 9745) e `Sunset` (RFC 8594) e `Link rel="deprecation"`; prazo mínimo de 6 meses entre Deprecation e Sunset.
  contact:
    name: Plataforma de Finanças — time de Autorização
servers:
  - url: https://api.financas.example
    description: Ambiente ilustrativo (domínio reservado .example, RFC 2606)
tags:
  - name: Autorizações
security:
  - oauth2: [autorizacoes/write]
paths:
  /v1/contratos/{id_contrato}/autorizacoes:
    post:
      tags: [Autorizações]
      operationId: autorizarTransacao
      summary: Autoriza (ou recusa) uma transação contra o limite do contrato
      description: |
        Decide de forma síncrona. Aprovação reserva/consome o limite de forma atômica (sem 409 por contenção) e publica
        TransacaoAutorizada; recusa por limite devolve 402, fica registrada e publica TransacaoRecusada.
      parameters:
        - $ref: '#/components/parameters/IdContrato'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoDeAutorizacao'
            examples:
              reserva:
                summary: Reserva (hold) de R$ 150,00
                value:
                  id_conta: "0001-12345678-9"
                  valor: 150.00
                  moeda: BRL
                  tipo_operacao: RESERVA
                  id_estabelecimento: "EST-998877"
                  metadata: { canal: POS, id_rastreio_canal: "pos-7f3a", geo: { uf: SP, municipio_ibge: "3509502" } }
              captura:
                summary: Captura parcial de uma reserva (DEBITO que referencia a RESERVA)
                value:
                  id_conta: "0001-12345678-9"
                  valor: 120.00
                  moeda: BRL
                  tipo_operacao: DEBITO
                  id_estabelecimento: "EST-998877"
                  id_autorizacao_original: "6f1c2b0e-3d4a-5b6c-8d7e-9f0a1b2c3d4e"
              estorno:
                summary: Estorno de uma autorização anterior
                value:
                  id_conta: "0001-12345678-9"
                  valor: 150.00
                  moeda: BRL
                  tipo_operacao: ESTORNO
                  id_autorizacao_original: "6f1c2b0e-3d4a-5b6c-8d7e-9f0a1b2c3d4e"
      responses:
        '201':
          description: Autorização aprovada (primeira execução).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutorizacaoAprovada' }
        '200':
          description: |
            Replay idempotente de uma aprovação — corpo idêntico ao da resposta original, inclusive o `correlation_id` da
            execução original. O header `X-Correlation-Id` é o desta requisição.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutorizacaoAprovada' }
        '400': { $ref: '#/components/responses/RequisicaoMalFormada' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '402': { $ref: '#/components/responses/LimiteInsuficiente' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/ContratoNaoEncontrado' }
        '405': { $ref: '#/components/responses/MetodoNaoPermitido' }
        '409': { $ref: '#/components/responses/Conflito' }
        '415': { $ref: '#/components/responses/TipoDeMidiaNaoSuportado' }
        '422': { $ref: '#/components/responses/RegraDeDominioViolada' }
        '429': { $ref: '#/components/responses/LimiteDeRequisicoes' }
        '500': { $ref: '#/components/responses/ErroInterno' }
        '503': { $ref: '#/components/responses/Indisponivel' }
        '504': { $ref: '#/components/responses/TempoEsgotado' }
  /v1/contratos/{id_contrato}/autorizacoes/{id_autorizacao}:
    get:
      tags: [Autorizações]
      operationId: consultarAutorizacao
      summary: Consulta o estado atual de uma autorização (útil após timeout do cliente)
      description: Leitura do estado atual. Não altera nada e não exige Idempotency-Key.
      security:
        - oauth2: [autorizacoes/read]
      parameters:
        - $ref: '#/components/parameters/IdContrato'
        - $ref: '#/components/parameters/IdAutorizacao'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Autorização encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Autorizacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/AutorizacaoNaoEncontrada' }
        '405': { $ref: '#/components/responses/MetodoNaoPermitido' }
        '422': { $ref: '#/components/responses/RegraDeDominioViolada' }
        '429': { $ref: '#/components/responses/LimiteDeRequisicoes' }
        '500': { $ref: '#/components/responses/ErroInterno' }
        '503': { $ref: '#/components/responses/Indisponivel' }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 client credentials (sistemas consumidores). Na AWS, Amazon Cognito com resource server `autorizacoes`.
      flows:
        clientCredentials:
          tokenUrl: https://auth.financas.example/oauth2/token
          scopes:
            autorizacoes/write: Criar autorizações (formato de escopo do Cognito, resource-server/escopo)
            autorizacoes/read: Consultar autorizações

  parameters:
    IdContrato:
      name: id_contrato
      in: path
      required: true
      description: Identificador do contrato (crédito, investimento, seguro ou consórcio).
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,20}$', example: CTR-000123456 }
    IdAutorizacao:
      name: id_autorizacao
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID gerado pelo cliente por operação lógica. Aceito com ou sem aspas (o draft IETF usa sf-string entre aspas).
        Ausente ou inválido → 400.
      schema: { type: string, pattern: '^"?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"?$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Correlação de negócio ponta a ponta. Se ausente, o serviço gera um. Valor fora do formato é ignorado (proteção contra log injection).
      schema: { type: string, format: uuid }
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        W3C Trace Context. Valor fora do formato é ignorado: não entra em log, no registro da autorização, no evento publicado
        nem na chamada a outro serviço (a requisição segue sem trace).
      schema: { type: string, pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$' }

  headers:
    Location:
      description: |
        Referência RELATIVA à autorização (`autorizacoes/{id_autorizacao}`), resolvida contra a URI da requisição
        (RFC 3986 §5.2): dá `.../contratos/{id_contrato}/autorizacoes/{id_autorizacao}` com ou sem o prefixo de stage do gateway.
      schema: { type: string, example: 'autorizacoes/6f1c2b0e-3d4a-5b6c-8d7e-9f0a1b2c3d4e' }
    CorrelationId:
      description: Correlação desta requisição (num replay, o corpo guarda a da execução original).
      schema: { type: string, format: uuid }
    Allow:
      description: Métodos suportados pelo recurso (RFC 9110 §10.2.1).
      schema: { type: string, example: POST }
    IdempotentReplayed:
      description: Presente (valor `true`) quando a resposta é um replay idempotente.
      schema: { type: string, enum: ['true'] }
    RetryAfter:
      description: Segundos sugeridos antes de tentar de novo.
      schema: { type: integer, minimum: 1 }

  schemas:
    Dinheiro:
      type: number
      description: |
        Valor monetário decimal(18,2), como no enunciado. O servidor faz parse exato (Decimal, sem ponto flutuante) e rejeita
        mais de 2 casas decimais com 422. Não usamos `multipleOf: 0.01` de propósito: validadores que dividem em ponto flutuante
        rejeitam valores válidos (0.29 / 0.01 = 28.999999999999996 → R$ 19,99 seria recusado; testado com jsonschema).
        A alternativa string-com-pattern (Open Finance Brasil, RFC 7493) está discutida no ADR-0011.
      minimum: 0
      maximum: 9999999999999999.99
    ValorPositivo:
      allOf: [ { $ref: '#/components/schemas/Dinheiro' } ]
      minimum: 0
      exclusiveMinimum: true
    TipoOperacao:
      type: string
      enum: [DEBITO, CREDITO, RESERVA, ESTORNO]
      description: |
        - RESERVA: bloqueia limite (hold) por até 7 dias. Sem captura nem estorno nesse prazo, expira e o limite volta.
        - DEBITO: consome limite imediatamente. Com `id_autorizacao_original` apontando para uma RESERVA aprovada, é a
          CAPTURA do hold (total ou parcial, até o valor reservado): o hold sai, o capturado vira utilizado e a sobra
          volta ao disponível, numa escrita só.
        - CREDITO: recompõe limite utilizado (ex.: pagamento). Não pode exceder o utilizado.
        - ESTORNO: reverte uma autorização anterior aprovada (exige `id_autorizacao_original`). O ESTORNO de um DEBITO devolve
          utilizado e, como o CREDITO, não pode exceder o utilizado do momento: o modelo não tem saldo credor (débito já pago
          por um CREDITO não tem o que devolver → 422 `CREDITO_EXCEDE_UTILIZADO`).
        Uma RESERVA sai de APROVADA por um único caminho (captura, estorno ou expiração): quem chega depois recebe 409.
    Metadata:
      type: object
      description: Allowlist de atributos de rastreio. Chaves fora da lista → 422. Sem dado pessoal (geo é só UF e município).
      additionalProperties: false
      properties:
        canal: { type: string, enum: [APP, WEB, POS, PIX, BACKOFFICE] }
        id_rastreio_canal: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
        geo:
          type: object
          additionalProperties: false
          properties:
            uf: { type: string, pattern: '^[A-Z]{2}$' }
            municipio_ibge: { type: string, pattern: '^[0-9]{7}$' }
    PedidoDeAutorizacao:
      type: object
      additionalProperties: false
      required: [id_conta, valor, moeda, tipo_operacao]
      properties:
        id_contrato:
          type: string
          description: Opcional no corpo (o enunciado o lista como path param). Se presente e diferente do path → 422.
        id_conta:
          type: string
          pattern: '^[A-Za-z0-9-]{1,16}$'
          description: |
            Número da conta corrente. Conferido contra a conta titular do contrato na réplica do core (BC Limites): diferente
            → 422 `CONTA_DIVERGENTE` (recusa registrada e publicada, sem saldos). Vale em toda operação, inclusive estorno e
            captura.
        valor:
          allOf: [ { $ref: '#/components/schemas/ValorPositivo' } ]
          description: Valor da transação em BRL, maior que zero, no máximo 2 casas decimais.
        moeda: { type: string, pattern: '^[A-Z]{3}$', description: 'Código ISO 4217. Na v1 só BRL é aceito (outro código válido → 422).' }
        tipo_operacao: { $ref: '#/components/schemas/TipoOperacao' }
        id_estabelecimento: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
        id_autorizacao_original: { type: string, format: uuid, description: 'Obrigatório em ESTORNO. Em DEBITO, indica captura da RESERVA referenciada. Proibido em RESERVA e CREDITO.' }
        metadata: { $ref: '#/components/schemas/Metadata' }
    Saldos:
      type: object
      required: [saldo_reservado, limite_disponivel, limite_utilizado, versao_limite]
      properties:
        saldo_reservado:
          allOf: [ { $ref: '#/components/schemas/Dinheiro' } ]
          description: Total reservado (em holds) no contrato após a operação — nome e semântica do enunciado.
        limite_disponivel:
          type: number
          description: Concedido − utilizado − reservado após a operação. Pode ser negativo só se o core reduziu o limite concedido.
        limite_utilizado: { $ref: '#/components/schemas/Dinheiro' }
        versao_limite: { type: integer, minimum: 1, description: Versão do agregado Limite após a operação (ordem por contrato). }
    AutorizacaoAprovada:
      allOf:
        - $ref: '#/components/schemas/Saldos'
        - type: object
          required: [id_autorizacao, id_contrato, status, tipo_operacao, valor, moeda, criada_em, correlation_id]
          properties:
            id_autorizacao: { type: string, format: uuid }
            id_contrato: { type: string }
            status: { type: string, enum: [APROVADA] }
            tipo_operacao: { $ref: '#/components/schemas/TipoOperacao' }
            valor: { $ref: '#/components/schemas/Dinheiro' }
            moeda: { type: string }
            id_autorizacao_original: { type: string, format: uuid }
            criada_em: { type: string, format: date-time }
            correlation_id: { type: string, format: uuid, description: 'Da execução que aprovou (num replay, a original).' }
    Autorizacao:
      type: object
      required: [id_autorizacao, id_contrato, status, tipo_operacao, valor, moeda, criada_em]
      properties:
        id_autorizacao: { type: string, format: uuid }
        id_contrato: { type: string }
        status:
          type: string
          enum: [EM_PROCESSAMENTO, APROVADA, RECUSADA, ESTORNADA, CAPTURADA, EXPIRADA, COMPENSANDO, COMPENSADA, RECONCILIACAO_MANUAL]
          description: |
            COMPENSANDO/COMPENSADA: o processamento foi interrompido e o reconciliador está desfazendo (ou desfez) o
            efeito; a mesma chave não é mais retomada (use uma nova).
            RECONCILIACAO_MANUAL: não dá para concluir com segurança de forma automática (passou do prazo em que
            reenviar ao limite é seguro, ou a reversão foi recusada); uma pessoa decide. Raro: exige o reconciliador
            ou o limite parados por minutos.
        motivo_recusa:
          type: string
          enum: [LIMITE_INSUFICIENTE, CONTRATO_INATIVO, CREDITO_EXCEDE_UTILIZADO, CONTRATO_NAO_ENCONTRADO, ORIGINAL_JA_ENCERRADA, RESERVA_DIVERGENTE, RESERVA_NAO_ENCONTRADA, ESTORNO_EM_ANDAMENTO, RECUSA_DO_LIMITE, CONTA_DIVERGENTE]
          description: |
            Presente em RECUSADA. `CREDITO_EXCEDE_UTILIZADO`: o valor a devolver (CREDITO ou ESTORNO de débito) é maior que o
            utilizado; o modelo não tem saldo credor. `CONTA_DIVERGENTE`: o `id_conta` informado não é o titular do contrato
            (a autorização fica sem `saldos`: quem errou a conta não vê o saldo de um contrato alheio).
            `RECUSA_DO_LIMITE`: motivo novo do BC Limites que esta versão ainda não mapeia.
        tipo_operacao: { $ref: '#/components/schemas/TipoOperacao' }
        valor: { $ref: '#/components/schemas/Dinheiro' }
        moeda: { type: string }
        saldos: { $ref: '#/components/schemas/Saldos' }
        criada_em: { type: string, format: date-time }
        atualizada_em: { type: string, format: date-time }
    Problema:
      type: object
      description: RFC 9457 Problem Details + extensões do domínio.
      required: [type, title, status, codigo, correlation_id]
      properties:
        type: { type: string, format: uri, example: 'https://financas.example/problemas/limite-insuficiente' }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        codigo: { type: string, description: Código estável e legível por máquina (o "código" pedido pelo enunciado). }
        correlation_id: { type: string, format: uuid, description: 'Desta requisição; numa recusa registrada, o da execução que a criou (replay idêntico).' }
        trace_id: { type: string, pattern: '^[0-9a-f]{32}$', nullable: true }
        id_autorizacao: { type: string, format: uuid, description: Presente em recusas (402) — a recusa também é registrada. }
        limite_disponivel:
          type: number
          description: Presente na recusa por limite (402) quando o limite respondeu com saldos — o disponível do contrato no momento da recusa.
        erros_omitidos:
          type: integer
          minimum: 1
          description: Presente quando `erros` foi cortado nos 20 primeiros itens; quantos ficaram de fora.
        erros:
          type: array
          maxItems: 20
          description: Detalhe por campo em erros de validação (400/422), no máximo 20 (ver `erros_omitidos`).
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo: { type: string }
              mensagem: { type: string }

  responses:
    RequisicaoMalFormada:
      description: |
        Sintaxe inválida, antes de qualquer regra:
        - `/problemas/requisicao-mal-formada`: corpo que não é JSON (serviço; inclui `NaN`/`Infinity`, que não são JSON pela
          RFC 8259 §6); na AWS, também header obrigatório ausente ou vazio,
          como `Idempotency-Key` (gateway, `BAD_REQUEST_PARAMETERS`: ele só confere a presença dos parâmetros).
        - `/problemas/idempotency-key-invalida`: `Idempotency-Key` ausente (local) ou fora do formato UUID (serviço).
        Campo desconhecido, tipo errado ou campo obrigatório ausente no corpo NÃO são 400: são 422 (`RegraDeDominioViolada`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    NaoAutenticado:
      description: |
        Token ausente/inválido (emitido pelo gateway). No acesso direto ao serviço, `X-Client-Id` ausente ou fora de
        `^[A-Za-z0-9._-]{1,64}$`. Ver `/problemas/nao-autenticado`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    SemPermissao:
      description: |
        Escopo insuficiente, API key inválida ou bloqueio por regra gerenciada do WAF (gateway responses
        `ACCESS_DENIED`, `INVALID_API_KEY` e `WAF_FILTERED`). Ver `/problemas/sem-permissao`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    LimiteInsuficiente:
      description: Recusa por regra de negócio — limite disponível menor que o valor. A recusa é registrada e publicada (TransacaoRecusada).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
          example:
            type: https://financas.example/problemas/limite-insuficiente
            title: Limite insuficiente
            status: 402
            detail: O limite disponível do contrato não cobre o valor solicitado.
            codigo: LIMITE_INSUFICIENTE
            id_autorizacao: 6f1c2b0e-3d4a-5b6c-8d7e-9f0a1b2c3d4e
            limite_disponivel: 100.00
            correlation_id: 0b8a1f2e-9c7d-4e6f-8a5b-3c2d1e0f9a8b
            trace_id: 4bf92f3577b34da6a3ce929d0e0e4736
    ContratoNaoEncontrado:
      description: Contrato inexistente na réplica do core (fail-closed). Ver `/problemas/contrato-nao-encontrado`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    AutorizacaoNaoEncontrada:
      description: Autorização inexistente para o contrato informado, ou criada por outro canal (não revela a existência).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Conflito:
      description: |
        Dois tipos distintos (campo `type`):
        - `/problemas/requisicao-em-andamento`: a mesma Idempotency-Key ainda está sendo processada (com Retry-After).
        - `/problemas/conflito-de-estado`: o estado mudou durante a operação (ex.: estorno ou captura de reserva já
          capturada/estornada/expirada; captura que perdeu o hold para um estorno concorrente; outro estorno da
          mesma autorização ainda em andamento; chave cuja órfã foi compensada ou está em reconciliação manual, sem
          Retry-After: repetir não muda o desfecho, consulte com GET).
        Não existe 409 por contenção de concorrência: reservas no mesmo contrato são serializadas pelo banco (ADR-0005).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    MetodoNaoPermitido:
      description: |
        Método HTTP que o recurso não suporta (acesso direto ao serviço; na AWS o gateway responde antes com 403
        `SEM_PERMISSAO`). Ver `/problemas/metodo-nao-permitido`.
      headers:
        Allow: { $ref: '#/components/headers/Allow' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    TipoDeMidiaNaoSuportado:
      description: Content-Type diferente de application/json.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    RegraDeDominioViolada:
      description: |
        JSON bem formado que viola o schema `PedidoDeAutorizacao` ou uma regra de domínio. O serviço é a autoridade (o gateway
        não valida o corpo). Por `codigo`:
        - `VALIDACAO_DE_DOMINIO` (com `erros`): campo obrigatório ausente, tipo errado, campo desconhecido, `metadata` fora da
          allowlist, corpo que não é objeto, enum/pattern violado; valor ≤ 0 ou com mais de 2 casas; moeda ≠ BRL; ESTORNO sem
          `id_autorizacao_original`; `id_autorizacao_original` em RESERVA/CREDITO; `id_contrato` do corpo ≠ path; parâmetro
          de path fora do pattern (inclusive `id_autorizacao` que não é UUID, no GET); recusa do limite sem código próprio.
          `erros` traz no máximo 20 itens (`erros_omitidos` diz quantos ficaram de fora).
        - `IDEMPOTENCY_KEY_REUTILIZADA`: mesma Idempotency-Key com corpo diferente.
        - `CONTRATO_INATIVO`: contrato BLOQUEADO ou ENCERRADO.
        - `CREDITO_EXCEDE_UTILIZADO`: o valor a devolver (CREDITO ou ESTORNO de débito) é maior que o utilizado; o modelo não tem
          saldo credor.
        - `CONTA_DIVERGENTE`: `id_conta` diferente da conta titular do contrato.
        - `AUTORIZACAO_ORIGINAL_INVALIDA` (ESTORNO ou captura): original inexistente, de outro contrato ou de outro canal;
          tipo da original não estornável (só RESERVA e DEBITO) ou não capturável (só RESERVA); original não APROVADA;
          estorno com valor diferente do original (estorno parcial não é suportado na v1); captura maior que o reservado.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    LimiteDeRequisicoes:
      description: |
        Só a borda emite 429; o serviço nunca (a proteção dele é o 503 de load shedding). Sempre com Retry-After.
        - Gateway: throttling (`THROTTLED`) ou quota diária (`QUOTA_EXCEEDED`) do usage plan do consumidor.
        - WAF: regras rate-based por consumidor (`x-api-key`) e por IP, tetos de proteção acima dos planos. Resposta
          customizada com o mesmo `codigo`, mas com `Content-Type: application/json` (o WAF não permite
          `application/problem+json`) e corpo fixo, sem `correlation_id` (o WAF não tem o id da requisição).
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    ErroInterno:
      description: Falha inesperada. Seguro repetir com a mesma Idempotency-Key.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Indisponivel:
      description: |
        Degradação — circuit breaker aberto, load shedding (fail-fast) ou banco de autorizações estrangulado/sem resposta/em
        conflito de transação. Seguro repetir com a mesma Idempotency-Key após Retry-After.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    TempoEsgotado:
      description: Timeout na integração (gateway). O resultado pode ter sido aplicado — repetir com a mesma Idempotency-Key ou consultar via GET.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
